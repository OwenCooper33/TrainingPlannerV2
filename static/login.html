<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrDupe Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="auth-wrap">
    <section class="panel auth-card">
      <h1>TrDupe</h1>
      <p>Sign in to access your training plan and integrations.</p>

      <h3>Login</h3>
      <div class="field"><label>Email</label><input id="loginEmail" type="email" /></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" /></div>
      <button id="loginBtn">Login</button>

      <h3>Create Account</h3>
      <div class="field"><label>Name</label><input id="registerName" /></div>
      <div class="field"><label>Email</label><input id="registerEmail" type="email" /></div>
      <div class="field"><label>Password (8+ chars)</label><input id="registerPassword" type="password" /></div>
      <button id="registerBtn">Create Account</button>

      <pre id="authLog"></pre>
    </section>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
